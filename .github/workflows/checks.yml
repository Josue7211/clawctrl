name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

concurrency:
  group: checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/vendor/**', 'src-tauri/build.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Install dependencies
        run: npm run setup

      - name: Verify desktop app
        run: npm run check:all

  review:
    name: Isolated feature review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run setup

      - name: Install review browser
        run: npm run review:install

      - name: Review Notes, Chat, and network isolation
        run: npm run review:features

      - name: Upload screenshots, recordings, and diagnostics
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-review-${{ github.run_attempt }}
          path: |
            review-results/
            review-report/
          retention-days: 14

      - name: Link review evidence
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          REVIEW_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: printf '[Feature screenshots, recordings, and browser results](%s)\n' "$REVIEW_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
